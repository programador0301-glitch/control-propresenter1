name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          zip=$(ls *.zip | head -n1)
          echo "Descomprimiendo: $zip"
          unzip -o "$zip" -d src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: src/procontrol-android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest "src/procontrol-android/app/build/outputs/apk/debug/app-debug.apk" --title "ProControl" --notes "APK generado automaticamente"
